<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- https://izlediklerim.wolkanca.com/ -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">

    <!-- Clapper top -->
    <g transform="translate(175 60) rotate(-15)">
      <rect x="0" y="0" width="250" height="40" rx="8" fill="#1f1f1f"/>
      <rect x="10" y="0" width="35" height="40" fill="#fff"/>
      <rect x="55" y="0" width="35" height="40" fill="#1f1f1f"/>
      <rect x="100" y="0" width="35" height="40" fill="#fff"/>
      <rect x="145" y="0" width="35" height="40" fill="#1f1f1f"/>
      <rect x="190" y="0" width="35" height="40" fill="#fff"/>
    </g>

    <!-- Clapper body -->
    <rect x="210" y="160" width="210" height="170" rx="18"
          fill="#232323" stroke="#111" stroke-width="6"/>

    <!-- Play button -->
    <rect x="255" y="190" width="120" height="110" rx="12"
          fill="#2f2f2f"/>

    <polygon points="295,212 350,245 295,278"
             fill="#ff1b1b"/>

    <!-- Film reel -->
    <circle cx="165" cy="235" r="105"
            fill="#fff" stroke="#1f1f1f" stroke-width="8"/>

    <circle cx="165" cy="235" r="18" fill="#111"/>

    <circle cx="165" cy="175" r="24" fill="#111"/>
    <circle cx="225" cy="235" r="24" fill="#111"/>
    <circle cx="165" cy="295" r="24" fill="#111"/>
    <circle cx="105" cy="235" r="24" fill="#111"/>

    <!-- Bookmark -->
    <path d="M305 330h40v62l-20-14-20 14z"
          fill="#fff" stroke="#1f1f1f" stroke-width="5"/>

  </g>
</svg>